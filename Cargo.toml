
[package]
name = "ferrumec"
version = "0.4.7"
edition = "2024"
description = "Core building blocks for event-driven Rust microservices: pluggable event streams (local or NATS), caching (Moka or Redis), and Postgres-backed infrastructure."
license = "MIT"

[dependencies]
actix-web = { version = "4.15.0", optional = true }
async-nats = { version = "0.47.0", optional = true }
async-trait = "0.1.92"
bytes = "1.12.1"
dashmap = { version = "6.2.1", optional = true }
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"], optional = true }
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["uuid"], optional = true }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[features]
local = ["moka", "dashmap"]
lite = ["sqlx/sqlite"]
pg = ["sqlx/postgres"]
distributed = ["redis", "async-nats", "pg"]
web = ["actix-web", "local"]
