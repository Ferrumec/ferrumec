[package]
name = "ferrumec"
version = "0.4.7"
edition = "2024"
description = "Core building blocks for event-driven Rust microservices: pluggable event streams (local or NATS), caching (Moka or Redis), and Postgres-backed infrastructure."
license = "MIT"

[dependencies]
actix-files = "0.6.10"
actix-web = { version = "4.15.0", optional = true }
async-nats = { version = "0.47.0", optional = true }
async-trait = "0.1.92"
bytes = "1.12.1"
dashmap = { version = "6.2.1", optional = true }
futures = "0.3.34"
futures-util = "0.3.34"
moka = { version = "0.12.16", features = ["future"], optional = true }
opentelemetry = {version="0.33.0",optional=true}
opentelemetry-appender-tracing = {version="0.33.0",optional=true}
opentelemetry-otlp = {version="0.33.0",optional=true}
opentelemetry_sdk = {version="0.33.0",optional=true}
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"], optional = true }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["uuid"], optional=true}
thiserror = "2.0.21"
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-actix-web = { version = "0.7.25", optional = true }
tracing-opentelemetry = {version="0.34.0",optional=true}
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde", "v4"] }

[features]
# Everything that runs in a single process, with no external service beyond Postgres:
# `MokaCacheFactory`, `LocalEventStream`, `Outbox` and `LocalInfra`. The traits
# (`Store`, `CacheFactory`, `EventStream`, `Subscriber`, `Infra`, ...) and the `Event`
# envelope are always available.
local = ["moka", "dashmap"]
lite = ["sqlx/sqlite"]
pg = ["sqlx/postgres"]
# Backends that need external services (Redis, NATS); not usable by a fully local instance.
distributed = ["redis", "async-nats","pg"]
# Everything that launches or depends on the actix-web service: `Module`, `modules!`,
# the permission middleware and `Infra::configure` (health endpoint).
web = ["actix-web", "tracing-actix-web","local"]
# HTTP server bootstrap with OpenTelemetry; implies `web`.
launch = ["web", "opentelemetry","opentelemetry-appender-tracing","opentelemetry-otlp","opentelemetry_sdk","tracing-opentelemetry"]
