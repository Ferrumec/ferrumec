[package]
name = "ferrumec"
version = "0.3.0"
edition = "2024"
description = "Core building blocks for event-driven Rust microservices: pluggable event streams (local or NATS), caching (Moka or Redis), and Postgres-backed infrastructure."
license = "MIT"

[dependencies]
actix-web = "4.15.0"
async-nats = { version = "0.47.0", optional = true }
async-trait = "0.1.92"
bytes = "1.12.1"
dashmap = "6.2.1"
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
opentelemetry = {version="0.33.0",optional=true}
opentelemetry-appender-tracing = {version="0.33.0",optional=true}
opentelemetry-otlp = {version="0.33.0",optional=true}
opentelemetry_sdk = {version="0.33.0",optional=true}
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"], optional = true }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
tracing-actix-web = "0.7.25"
tracing-opentelemetry = "0.34.0"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
uuid = { version = "1.26.1", features = ["serde"] }

[features]
distributed = ["redis", "async-nats"]
launch = ["opentelemetry","opentelemetry-appender-tracing","opentelemetry-otlp","opentelemetry_sdk"]
