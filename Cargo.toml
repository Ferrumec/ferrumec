[package]
name = "ferrumec"
version = "0.1.0"
edition = "2024"

[dependencies]
async-nats = { version = "0.47.0", optional = true }
async-trait = "0.1.92"
bytes = "1.12.1"
dashmap = "6.2.1"
futures = "0.3.34"
moka = { version = "0.12.16", features = ["future"] }
redis = { version = "1.7.0", features = ["aio", "connection-manager", "tokio-comp"], optional = true }
serde = "1.0.229"
serde_json = "1.0.151"
sqlx = { version = "0.9.0", features = ["postgres"] }
tokio = { version = "1", features = ["rt", "sync", "macros", "time"] }
tracing = "0.1.44"
uuid = { version = "1.26.1", features = ["serde"] }

[features]
distributed = ["redis", "async-nats"]
